name: ReconAI APK
on:
  push:
    paths: ['reconai/**', '.github/workflows/reconai.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reconai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK licenses, NDK, CMake
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;29.0.13113456" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ReconAI-apk
          path: reconai/app/build/outputs/apk/release/*.apk
